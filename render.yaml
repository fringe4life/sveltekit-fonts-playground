# Hint / Blueprint. Two free Web Services — do not collapse bun and node.
# Services must exist (dashboard or Blueprint sync) before `render deploys create`.
# Render has no `runtime: bun` (invalid YAML). Native runtime is `node` for both.
#
# bun service: Bun is in the Node native image (`🟢 bun`) once you pin a version.
# Without BUN_VERSION / .bun-version (and with no bun.lock here), Render omits Bun.
# Start MUST be `bun ./build`. Do not `node build` on this service.
#
# node service: ADAPTER=node, start `node build`. No Bun pin — that is the bun service.
# Each free instance sleeps independently (~15 min idle → ~1 min wake).
services:
  - type: web
    name: sveltekit-fonts-playground
    runtime: node
    plan: free
    # npx pnpm — not `corepack enable` (EROFS on Render Node 24 rewriting /usr/bin/pnpm).
    # bun run vite looks up a package.json script named "vite" (there isn't one).
    # bunx resolves node_modules after the same pnpm install the node service uses.
    buildCommand: npx --yes pnpm@12.14.0 install --frozen-lockfile && ADAPTER=bun bunx --bun vite build
    startCommand: bun ./build
    healthCheckPath: /
    envVars:
      - key: BUN_VERSION
        value: 1.4.4
      - key: ADAPTER
        value: bun

  - type: web
    name: sveltekit-fonts-playground-node
    runtime: node
    plan: free
    buildCommand: npx --yes pnpm@12.14.0 install --frozen-lockfile && ADAPTER=node pnpm build
    startCommand: node build
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: ADAPTER
        value: node
