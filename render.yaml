# Hint / Blueprint. Service must exist before `render deploys create`.
# Render's native runtime is `node`; Bun is installed in the build image so
# adapter-bun can still compile and start (`bun ./build`).
services:
  - type: web
    name: sveltekit-fonts-playground
    runtime: node
    plan: free
    buildCommand: npm i -g bun pnpm@12.14.0 && pnpm install --frozen-lockfile && ADAPTER=bun bun run --bun vite build
    startCommand: bun ./build
    healthCheckPath: /
